name: Tag Release

# Merging a version bump to main is the release: this tags the merged commit
# v<version>, and the tag starts release.yml. The tag is created with the
# release GitHub App's token because only that app may create v* tags (the
# "Release Tags" ruleset), and because a tag created with GITHUB_TOKEN would not
# start another workflow.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # A Cargo.toml change that leaves the version alone, such as a dependency
      # update, finds its tag already there and stops.
      - name: Decide whether this commit is a new release
        id: version
        run: |
          VERSION=$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{print $2; exit}' Cargo.toml)
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(git tag -l 'v*' | grep -vE -- '-(alpha|beta|rc|test)[.0-9]*$' | sed 's/^v//' | sort -V | tail -n1)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::error::Cargo.toml version $VERSION is not newer than the latest release, v$LATEST. Raise it above v$LATEST to release."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get the release app token
        if: steps.version.outputs.tag != ''
        id: app-token
        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94  # v2.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create the tag
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          echo "Tagged $GITHUB_SHA as $TAG; release.yml publishes it"
